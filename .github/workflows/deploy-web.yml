name: Deploy web app

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Secrets are only released to jobs targeting this environment, and its
    # protection rules (required reviewer, web-v* tag rule) gate each run.
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: src/dist

      - name: Install SSH key and pinned host key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: rsync -avzO --no-perms --no-owner --no-group --delete src/dist/ deploy-indiflight@app.indiflight.org:/
